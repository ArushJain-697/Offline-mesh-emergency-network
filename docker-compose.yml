services:
  node_a:
    build: .
    container_name: mesh_node_a
    hostname: node_a
    stdin_open: true
    tty: true
    ports:
      - "9001:9001/udp"   # exposes node A's UDP port to the host
    networks:
      mesh_net:
        ipv4_address: 10.10.0.2

  node_b:
    build: .
    container_name: mesh_node_b
    hostname: node_b
    stdin_open: true
    tty: true
    ports:
      - "9002:9002/udp"   # exposes node B's UDP port to the host
    networks:
      mesh_net:
        ipv4_address: 10.10.0.3

  node_c:
    build: .
    container_name: mesh_node_c
    hostname: node_c
    stdin_open: true
    tty: true
    ports:
      - "9003:9003/udp"   # exposes node C's UDP port to the host
    networks:
      mesh_net:
        ipv4_address: 10.10.0.4

networks:
  mesh_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24