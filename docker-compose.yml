services:
  mesh_node:
    build: .
    stdin_open: true
    tty: true
    environment:
      - MESH_PORT=${MESH_PORT:-9001}
    # Node reads its port from the env var and runs auto-discovery.
    # For cross-machine bootstrap, override the command:
    #   docker run ... mesh_cli 9002 192.168.1.10 9001
    command: ["sh", "-c", "./mesh_cli $MESH_PORT"]
    ports:
      - "${MESH_PORT:-9001}:${MESH_PORT:-9001}/udp"
      - "9000:9000/udp"   # shared discovery port
    networks:
      mesh_net:

networks:
  mesh_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24